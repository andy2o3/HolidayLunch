const AVATAR_COLORS = [
  'bg-[#005EB8] text-white',
  'bg-[#0B1F3A] text-white',
  'bg-emerald-700 text-white',
  'bg-sky-600 text-white',

];

const formatDateParts = (dateStr) => {
  if (!dateStr) return { weekday: 'TBD', month: '', day: '?', full: 'Date TBD', year: '' };
  const [year, month, day] = dateStr.split('-').map(Number);
  const dateObj = new Date(year, month - 1, day);
  return {
    weekday: dateObj.toLocaleDateString('en-US', { weekday: 'short' }),
    month: dateObj.toLocaleDateString('en-US', { month: 'short' }),
    day: day,
    year: year,
    full: dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }),
  };
};

const getInitials = (name) => {
  const parts = (name || '').trim().split(/\s+/);
  if (parts.length === 0 || !parts[0]) return '?';
  if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
};

const getAvatarColor = (name) => {
  let hash = 0;
  for (let i = 0; i < (name || '').length; i++) {
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
};

const toDocKey = (name) => {
  return name.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '_');
};

// ============================================================================
// MAIN APPLICATION COMPONENT
// ============================================================================

function App() {
  // Room / Poll Identification from URL query parameter (?room=...)
  const [roomId, setRoomId] = useState(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      return params.get('room') || 'cartus-it-2026';
    } catch {
      return 'cartus-it-2026';
    }
  });

  // Firebase Auth & Connection State
  const [user, setUser] = useState(null);
  const [syncStatus, setSyncStatus] = useState('connecting');

  // Live Clock State for Restaurant Poll Deadline
  const [nowMs, setNowMs] = useState(() => Date.now());

  // Event Metadata State (Synced in real time with Firebase Firestore)
  const [eventData, setEventData] = useState({
    title: 'Cartus IT Holiday & New Year Lunch 2026–2027 🎄🥂',
    targetWindow: 'First 3 Weeks of December 2026 • Requested by Maxim',
    location: 'TBD — Vote on Restaurant Suggestions Below!',
    notes: 'Maxim requested the first 2–3 weeks of December (Dec 1 – Dec 18) for our Cartus IT holiday celebration. Enter your name, tap any date(s) that work for you, and suggest/vote on a restaurant before Friday, Nov 20 at 11:59 PM!',
    dates: DEFAULT_CANDIDATE_DATES,
    restaurants: [],
    restaurantPollForceClosed: false,
    lockedDateId: null,
    sharedUrl: '',
  });

  // All Participants State (Synced in real time from Firestore subcollection)
  const [participants, setParticipants] = useState([]);

  // Current User Interaction State
  const [voterName, setVoterName] = useState(() => {
    try {
      return localStorage.getItem('cartus_it_voter_name_2026') || '';
    } catch {
      return '';
    }
  });
  const [selectedWeekFilter, setSelectedWeekFilter] = useState('all');

  // Restaurant Suggestion Inputs
  const [newRestaurantName, setNewRestaurantName] = useState('');
  const [newRestaurantNote, setNewRestaurantNote] = useState('');

  // Modal & UI Feedback State
  const [showShareModal, setShowShareModal] = useState(false);
  const [showAddDateModal, setShowAddDateModal] = useState(false);
  const [showNewPollModal, setShowNewPollModal] = useState(false);
  const [newDateStr, setNewDateStr] = useState('2026-12-10');
  const [newTimeLabel, setNewTimeLabel] = useState('12:00 PM');
  const [newPollTitle, setNewPollTitle] = useState('Cartus IT Holiday & New Year Lunch 2026–2027 🎄');
  const [newPollLocation, setNewPollLocation] = useState('');
  const [shareUrlInput, setShareUrlInput] = useState('');
  const [copiedType, setCopiedType] = useState(null);
  const [toastMessage, setToastMessage] = useState(null);

  // Live clock tick every 30s to evaluate deadline automatically
  useEffect(() => {
    const interval = setInterval(() => setNowMs(Date.now()), 30000);
    return () => clearInterval(interval);
  }, []);

  // Persist local voter name for convenience on refresh
  useEffect(() => {
    try {
      localStorage.setItem('cartus_it_voter_name_2026', voterName);
    } catch {
      // Ignore storage restrictions
    }
  }, [voterName]);

  // 1. Authenticate Anonymously with Firebase on Mount
  useEffect(() => {
    const initAuth = async () => {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.error('Firebase Auth error:', err);
        setSyncStatus('error');
      }
    };
    initAuth();

    const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
      setUser(currentUser);
    });
    return () => unsubscribe();
  }, []);

  // 2. Subscribe to Real-Time Room Document & Votes Subcollection in Firestore
  useEffect(() => {
    if (!user) return;

    setSyncStatus('connecting');
    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId);
    const votesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId, 'votes');

    const unsubRoom = onSnapshot(
      roomDocRef,
      async (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          setEventData({
            title: data.title || 'Cartus IT Holiday & New Year Lunch 2026–2027 🎄🥂',
            targetWindow: data.targetWindow || 'First 3 Weeks of December 2026 • Requested by Maxim',
            location: data.location || 'TBD — Vote on Restaurant Suggestions Below!',
            notes:
              data.notes ||
              'Maxim requested the first 2–3 weeks of December (Dec 1 – Dec 18) for our Cartus IT holiday celebration. Enter your name, tap any date(s) that work for you, and suggest/vote on a restaurant before Friday, Nov 20 at 11:59 PM!',
            dates: Array.isArray(data.dates) && data.dates.length > 0 ? data.dates : DEFAULT_CANDIDATE_DATES,
            restaurants: Array.isArray(data.restaurants) ? data.restaurants : [],
            restaurantPollForceClosed: Boolean(data.restaurantPollForceClosed),
            lockedDateId: data.lockedDateId || null,
            sharedUrl: data.sharedUrl || '',
          });
          setSyncStatus('connected');
        } else {
          // Initialize default shared room in Firestore if it doesn't exist yet
          const initialPayload = {
            title: 'Cartus IT Holiday & New Year Lunch 2026–2027 🎄🥂',
            targetWindow: 'First 3 Weeks of December 2026 • Requested by Maxim',
            location: 'TBD — Vote on Restaurant Suggestions Below!',
            notes: 'Maxim requested the first 2–3 weeks of December (Dec 1 – Dec 18) for our Cartus IT holiday celebration. Enter your name, tap any date(s) that work for you, and suggest/vote on a restaurant before Friday, Nov 20 at 11:59 PM!',
            dates: DEFAULT_CANDIDATE_DATES,
            restaurants: [],
            restaurantPollForceClosed: false,
            lockedDateId: null,
            sharedUrl: '',
            createdAt: serverTimestamp(),
          };
          try {
            await setDoc(roomDocRef, initialPayload, { merge: true });
            setSyncStatus('connected');
          } catch (e) {
            console.error('Error initializing room:', e);
            setSyncStatus('error');
          }
        }
      },
      (err) => {
        console.error('Firestore room listener error:', err);
        setSyncStatus('error');
      }
    );

    const unsubVotes = onSnapshot(
      votesColRef,
      (querySnap) => {
        const loadedParticipants = [];
        querySnap.forEach((docSnap) => {
          const d = docSnap.data();
          if (d && d.name) {
            loadedParticipants.push({
              id: docSnap.id,
              name: d.name,
              votes: d.votes || {},
              restaurantVotes: Array.isArray(d.restaurantVotes) ? d.restaurantVotes : [],
              rsvpAfterRestaurantClose: Boolean(d.rsvpAfterRestaurantClose),
              updatedAtMs: d.updatedAtMs || 0,
            });
          }
        });
        loadedParticipants.sort((a, b) => (a.updatedAtMs || 0) - (b.updatedAtMs || 0));
        setParticipants(loadedParticipants);
      },
      (err) => {
        console.error('Firestore votes listener error:', err);
      }
    );

    return () => {
      unsubRoom();
      unsubVotes();
    };
  }, [user, roomId]);

  const triggerToast = (msg, type = 'success') => {
    setToastMessage({ text: msg, type });
    setTimeout(() => setToastMessage(null), 3400);
  };

  // ============================================================================
  // DERIVED POLL STATE (DATES & RESTAURANTS)
  // ============================================================================

  const normalizedVoterName = voterName.trim();
  const activeParticipant = useMemo(() => {
    if (!normalizedVoterName) return null;
    return participants.find((p) => p.name.toLowerCase() === normalizedVoterName.toLowerCase()) || null;
  }, [participants, normalizedVoterName]);

  const isDeadlinePassed = nowMs >= RESTAURANT_DEADLINE_MS;
  const isRestaurantPollClosed = eventData.restaurantPollForceClosed || isDeadlinePassed;

  const countdownLabel = useMemo(() => {
    if (isRestaurantPollClosed) {
      return isDeadlinePassed
        ? 'Closed • Deadline Passed (Fri, Nov 20)'
        : 'Closed Early by Host • Restaurant Selection Locked';
    }
    const diff = Math.max(0, RESTAURANT_DEADLINE_MS - nowMs);
    const totalMinutes = Math.floor(diff / 60000);
    const days = Math.floor(totalMinutes / (60 * 24));
    const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
    const mins = totalMinutes % 60;
    const parts = [];
    if (days > 0) parts.push(`${days}d`);
    parts.push(`${hours}h`);
    parts.push(`${mins}m`);
    return `Closes Fri, Nov 20, 11:59 PM (${parts.join(' ')} left)`;
  }, [nowMs, isRestaurantPollClosed, isDeadlinePassed]);

  const dateStats = useMemo(() => {
    return eventData.dates.map((d) => {
      const yesPeople = [];
      participants.forEach((p) => {
        const val = p.votes?.[d.id];
        if (val === 'yes' || val === 'maybe') {
          yesPeople.push(p.name);
        }
      });
      return {
        ...d,
        yesCount: yesPeople.length,
        yesPeople,
      };
    });
  }, [eventData.dates, participants]);

  const topDates = useMemo(() => {
    return [...dateStats].sort((a, b) => b.yesCount - a.yesCount);
  }, [dateStats]);

  const maxYesCount = topDates.length > 0 ? topDates[0].yesCount : 0;

  const restaurantStats = useMemo(() => {
    return (eventData.restaurants || [])
      .map((rest) => {
        const voters = participants
          .filter((p) => Array.isArray(p.restaurantVotes) && p.restaurantVotes.includes(rest.id))
          .map((p) => p.name);
        return {
          ...rest,
          voteCount: voters.length,
          voters,
        };
      })
      .sort((a, b) => b.voteCount - a.voteCount);
  }, [eventData.restaurants, participants]);

  const topRestaurantVoteCount = restaurantStats.length > 0 ? restaurantStats[0].voteCount : 0;
  const winningRestaurants = useMemo(() => {
    if (topRestaurantVoteCount === 0) return [];
    return restaurantStats.filter((r) => r.voteCount === topRestaurantVoteCount);
  }, [restaurantStats, topRestaurantVoteCount]);

  const hasWeekendsEnabled = useMemo(() => {
    return eventData.dates.some((d) => d.isWeekend);
  }, [eventData.dates]);

  const hasNewYearEnabled = useMemo(() => {
    return eventData.dates.some((d) => d.isNewYear);
  }, [eventData.dates]);

  const filteredDates = useMemo(() => {
    if (selectedWeekFilter === 'all') return dateStats;
    return dateStats.filter((d) => String(d.weekGroup) === String(selectedWeekFilter));
  }, [dateStats, selectedWeekFilter]);

  const activeUserYesCount = useMemo(() => {
    if (!activeParticipant) return 0;
    return Object.values(activeParticipant.votes || {}).filter((v) => v === 'yes' || v === 'maybe').length;
  }, [activeParticipant]);

  // ============================================================================
  // FIRESTORE REAL-TIME ACTIONS
  // ============================================================================

  const handleToggleDate = async (dateId) => {
    if (!normalizedVoterName) {
      triggerToast('Enter your name first in Step 1 so everyone sees your pick!', 'error');
      const nameInput = document.getElementById('voter-name-input');
      if (nameInput) nameInput.focus();
      return;
    }
    if (!user) {
      triggerToast('Connecting to live cloud database... try again in a second.', 'info');
      return;
    }

    const docKey = activeParticipant ? activeParticipant.id : toDocKey(normalizedVoterName);
    const currentVotes = activeParticipant ? { ...activeParticipant.votes } : {};
    const isCurrentlySelected = currentVotes[dateId] === 'yes' || currentVotes[dateId] === 'maybe';

    if (isCurrentlySelected) {
      delete currentVotes[dateId];
    } else {
      currentVotes[dateId] = 'yes';
    }

    const voteDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId, 'votes', docKey);
    try {
      const isLateRsvp = !activeParticipant && isRestaurantPollClosed;
      await setDoc(
        voteDocRef,
        {
          name: activeParticipant ? activeParticipant.name : normalizedVoterName,
          votes: currentVotes,
          restaurantVotes: activeParticipant ? activeParticipant.restaurantVotes || [] : [],
          rsvpAfterRestaurantClose: activeParticipant
            ? Boolean(activeParticipant.rsvpAfterRestaurantClose)
            : isLateRsvp,
          updatedAtMs: activeParticipant?.updatedAtMs || Date.now(),
        },
        { merge: true }
      );
    } catch (err) {
      console.error('Error saving date vote:', err);
      triggerToast('Could not sync date pick. Check connection.', 'error');
    }
  };

  const handleAddRestaurantSuggestion = async (e) => {
    e.preventDefault();
    if (isRestaurantPollClosed) {
      triggerToast('Restaurant suggestions closed on Friday, Nov 20.', 'info');
      return;
    }
    if (!user) return;

    const cleanName = newRestaurantName.trim();
    if (!cleanName) {
      triggerToast('Please enter a restaurant name.', 'error');
      return;
    }

    const exists = (eventData.restaurants || []).some(
      (r) => r.name.toLowerCase() === cleanName.toLowerCase()
    );
    if (exists) {
      triggerToast('That restaurant is already on the list — tap Vote on it below!', 'info');
      setNewRestaurantName('');
      setNewRestaurantNote('');
      return;
    }

    const newRestObj = {
      id: 'rest-' + Date.now(),
      name: cleanName,
      note: newRestaurantNote.trim(),
      suggestedBy: normalizedVoterName || 'Cartus IT Member',
    };

    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId);
    try {
      await updateDoc(roomDocRef, {
        restaurants: [...(eventData.restaurants || []), newRestObj],
      });

      if (normalizedVoterName) {
        const docKey = activeParticipant ? activeParticipant.id : toDocKey(normalizedVoterName);
        const currentRestVotes = activeParticipant ? [...(activeParticipant.restaurantVotes || [])] : [];
        if (!currentRestVotes.includes(newRestObj.id)) {
          currentRestVotes.push(newRestObj.id);
        }
        const voteDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId, 'votes', docKey);
        await setDoc(
          voteDocRef,
          {
            name: activeParticipant ? activeParticipant.name : normalizedVoterName,
            votes: activeParticipant ? activeParticipant.votes || {} : {},
            restaurantVotes: currentRestVotes,
            rsvpAfterRestaurantClose: false,
            updatedAtMs: activeParticipant?.updatedAtMs || Date.now(),
          },
          { merge: true }
        );
      }

      setNewRestaurantName('');
      setNewRestaurantNote('');
      triggerToast(`Added "${cleanName}" to the restaurant poll!`);
    } catch (err) {
      console.error('Error adding restaurant:', err);
      triggerToast('Could not add restaurant suggestion.', 'error');
    }
  };

  const handleToggleRestaurantVote = async (restaurantId) => {
    if (isRestaurantPollClosed) {
      triggerToast('Restaurant voting is now closed! You can still RSVP for a lunch date above.', 'info');
      return;
    }
    if (!normalizedVoterName) {
      triggerToast('Enter your name in Step 1 before voting on a restaurant!', 'error');
      const nameInput = document.getElementById('voter-name-input');
      if (nameInput) nameInput.focus();
      return;
    }
    if (!user) return;

    const docKey = activeParticipant ? activeParticipant.id : toDocKey(normalizedVoterName);
    const currentRestVotes = activeParticipant ? [...(activeParticipant.restaurantVotes || [])] : [];
    const idx = currentRestVotes.indexOf(restaurantId);
    if (idx >= 0) {
      currentRestVotes.splice(idx, 1);
    } else {
      currentRestVotes.push(restaurantId);
    }

    const voteDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId, 'votes', docKey);
    try {
      await setDoc(
        voteDocRef,
        {
          name: activeParticipant ? activeParticipant.name : normalizedVoterName,
          votes: activeParticipant ? activeParticipant.votes || {} : {},
          restaurantVotes: currentRestVotes,
          rsvpAfterRestaurantClose: false,
          updatedAtMs: activeParticipant?.updatedAtMs || Date.now(),
        },
        { merge: true }
      );
    } catch (err) {
      console.error('Error voting on restaurant:', err);
      triggerToast('Could not save restaurant vote.', 'error');
    }
  };

  const handleToggleRestaurantPollClose = async () => {
    if (!user) return;
    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId);
    const nextState = !eventData.restaurantPollForceClosed;
    try {
      await updateDoc(roomDocRef, { restaurantPollForceClosed: nextState });
      triggerToast(
        nextState
          ? 'Restaurant poll closed! Teammates can still RSVP for lunch dates.'
          : 'Restaurant poll reopened for voting.'
      );
    } catch (err) {
      console.error('Error toggling restaurant poll state:', err);
    }
  };

  const handleToggleWeekends = async () => {
    if (!user) return;
    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId);
    let updatedDates;
    if (hasWeekendsEnabled) {
      updatedDates = eventData.dates.filter((d) => !d.isWeekend);
      triggerToast('Removed December weekend slots');
    } else {
      const existingIds = new Set(eventData.dates.map((d) => d.id));
      const toAdd = WEEKEND_CANDIDATE_DATES.filter((d) => !existingIds.has(d.id));
      updatedDates = [...eventData.dates, ...toAdd].sort((a, b) => a.dateStr.localeCompare(b.dateStr));
      triggerToast('Added December weekend slots for everyone');
    }
    try {
      await updateDoc(roomDocRef, { dates: updatedDates });
    } catch (err) {
      console.error('Error updating weekends:', err);
    }
  };

  const handleToggleNewYearWeek = async () => {
    if (!user) return;
    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId);

    if (hasNewYearEnabled) {
      updatedDates = eventData.dates.filter((d) => !d.isNewYear);
      if (selectedWeekFilter === '4') setSelectedWeekFilter('all');
      triggerToast('Removed New Year 2027 Kickoff week');

      const existingIds = new Set(eventData.dates.map((d) => d.id));
      const toAdd = NEW_YEAR_KICKOFF_DATES.filter((d) => !existingIds.has(d.id));
      updatedDates = [...eventData.dates, ...toAdd].sort((a, b) => a.dateStr.localeCompare(b.dateStr));
      triggerToast('Added New Year 2027 Kickoff Week (Jan 4–8)');

    try {
      await updateDoc(roomDocRef, { dates: updatedDates });

      console.error('Error updating New Year dates:', err);

  const handleAddCustomDate = async (e) => {
    e.preventDefault();
    if (!newDateStr || !user) return;

    const id = `${newDateStr}-${newTimeLabel.replace(/\s+/g, '')}`;
    if (eventData.dates.some((d) => d.id === id)) {
      triggerToast('That date & time is already on the poll!', 'info');
      return;
    }

    const [, month, day] = newDateStr.split('-').map(Number);
    let weekGroup = 0;
    let tag = 'Custom Date';
    if (newDateStr.startsWith('2026-12')) {
      if (day <= 6) { weekGroup = 1; tag = 'Week 1 • Custom'; }
      else if (day <= 13) { weekGroup = 2; tag = 'Week 2 • Custom'; }
      else if (day <= 20) { weekGroup = 3; tag = 'Week 3 • Custom'; }
      else { weekGroup = 3; tag = 'Late Dec • Custom'; }
    } else if (newDateStr.startsWith('2027-01')) {
      weekGroup = 4;
      tag = 'New Year 2027 • Custom';
    }

    const updatedDates = [
      ...eventData.dates,
      { id, dateStr: newDateStr, timeLabel: newTimeLabel, tag, weekGroup },
    ].sort((a, b) => a.dateStr.localeCompare(b.dateStr));

    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId);
    try {
      await updateDoc(roomDocRef, { dates: updatedDates });
      setShowAddDateModal(false);
      triggerToast('Added new date option for the whole team!');

      console.error('Error adding date:', err);

      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);

    return `🎄 *${eventData.title}* 🥂\n🔵 *Cartus IT Team • Christmas & New Year 2026–2027*\n🗓️ Primary Window: First 3 Weeks of December 2026 (Dec 1 – Dec 18) — Requested by Maxim${restLine}\n\nHey Cartus IT! Just enter your name and tap the December dates that work for you (you can also see who already picked each date!):${linkLine}`;

                <input
                  type="url"
                  inputMode="url"
                  value={shareUrlInput}
                  onChange={(e) => handleSavePublicShareUrl(e.target.value)}
                  placeholder="https://g.co/gemini/share/..."
                  className="flex-1 min-h-[46px] px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-[#005EB8] text-base text-slate-800 outline-none"
                />
                {savedShareUrl && (
                  <button
                    onClick={() => copyToClipboard(savedShareUrl, 'link')}
                    className="inline-flex items-center justify-center gap-1.5 min-h-[46px] px-4 py-2.5 rounded-xl bg-[#0B1F3A] hover:bg-[#102A4C] text-white text-sm font-semibold shrink-0 transition-all touch-manipulation"
                  >
                    {copiedType === 'link' ? <Check className="w-4 h-4 text-emerald-400" /> : <Copy className="w-4 h-4" />}
                    <span>{copiedType === 'link' ? 'Copied!' : 'Copy'}</span>
                  </button>
                )}
              </div>
            </div>

            <div className="space-y-2">
              <label className="text-xs font-bold uppercase tracking-wider text-slate-500">
                Cartus IT Invite Message
              </label>
              <textarea
                readOnly
                rows={6}
                value={groupChatInviteText}
                className="w-full p-3.5 rounded-xl border border-slate-200 bg-slate-50 text-xs sm:text-sm text-slate-700 leading-relaxed resize-none focus:outline-none"
              />
              <button
                onClick={() => copyToClipboard(groupChatInviteText, 'invite')}
                className="w-full min-h-[48px] inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-gradient-to-r from-[#005EB8] to-[#00A3E0] hover:brightness-110 text-white text-sm font-bold shadow-md shadow-sky-200 transition-all touch-manipulation"
              >
                {copiedType === 'invite' ? <Check className="w-4 h-4" /> : <Copy className="w-4 h-4" />}
                <span>{copiedType === 'invite' ? 'Invite Message Copied!' : 'Copy Invite Message for Chat'}</span>
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ====================================================================== */}
      {/* MODAL 2: ADD CUSTOM DATE (Mobile Bottom Sheet)                         */}
      {/* ====================================================================== */}
      {showAddDateModal && (
        <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
          <form
            onSubmit={handleAddCustomDate}
            className="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-2xl border border-slate-100 space-y-4"
            style={{ paddingBottom: 'calc(1.25rem + env(safe-area-inset-bottom, 0px))' }}
          >
            <div className="flex items-center justify-between">
              <h3 className="text-lg font-extrabold text-[#0B1F3A]">Add Custom Date Option</h3>
              <button
                type="button"
                onClick={() => setShowAddDateModal(false)}
                className="w-10 h-10 flex items-center justify-center rounded-xl text-slate-400 hover:text-slate-700 touch-manipulation"
              >
                <X className="w-5 h-5" />
              </button>
            </div>

            <div className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">Select Date</label>
                <input
                  type="date"
                  required
                  value={newDateStr}
                  onChange={(e) => setNewDateStr(e.target.value)}
                  className="w-full min-h-[46px] px-3.5 py-2.5 rounded-xl border border-slate-200 text-base font-medium focus:border-[#005EB8] outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">Lunch Time</label>
                <select
                  value={newTimeLabel}
                  onChange={(e) => setNewTimeLabel(e.target.value)}
                  className="w-full min-h-[46px] px-3.5 py-2.5 rounded-xl border border-slate-200 text-base font-medium focus:border-[#005EB8] outline-none bg-white"
                >
                  <option value="11:30 AM">11:30 AM</option>
                  <option value="12:00 PM">12:00 PM</option>
                  <option value="12:30 PM">12:30 PM</option>
                  <option value="1:00 PM">1:00 PM</option>
                  <option value="1:30 PM">1:30 PM</option>
                </select>
              </div>
            </div>

            <div className="flex items-center justify-end gap-2 pt-2">
              <button
                type="button"
                onClick={() => setShowAddDateModal(false)}
                className="min-h-[44px] px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 touch-manipulation"
              >
                Cancel
              </button>
              <button
                type="submit"
                className="min-h-[44px] px-5 py-2 rounded-xl text-sm font-bold text-white bg-[#005EB8] hover:bg-[#004A99] shadow-sm touch-manipulation"
              >
                Add to Poll
              </button>
            </div>
          </form>
        </div>
      )}

      {/* ====================================================================== */}
      {/* MODAL 3: START A NEW LIVE POLL ROOM (Mobile Bottom Sheet)              */}
      {/* ====================================================================== */}
      {showNewPollModal && (
        <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
          <form
            onSubmit={handleCreateNewRoom}
            className="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-2xl border border-slate-100 space-y-4"
            style={{ paddingBottom: 'calc(1.25rem + env(safe-area-inset-bottom, 0px))' }}
          >
            <div className="flex items-center justify-between">
              <h3 className="text-lg font-extrabold text-[#0B1F3A]">Create Separate Live Poll Room</h3>
              <button
                type="button"
                onClick={() => setShowNewPollModal(false)}
                className="w-10 h-10 flex items-center justify-center rounded-xl text-slate-400 hover:text-slate-700 touch-manipulation"
              >
                <X className="w-5 h-5" />
              </button>
            </div>

            <p className="text-xs text-slate-500">
              Spins up a fresh, isolated live cloud room for another sub-team while keeping your current Cartus IT poll intact.
            </p>

            <div className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">Event Name</label>
                <input
                  type="text"
                  required
                  value={newPollTitle}
                  onChange={(e) => setNewPollTitle(e.target.value)}
                  className="w-full min-h-[46px] px-3.5 py-2.5 rounded-xl border border-slate-200 text-base font-medium focus:border-[#005EB8] outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">Initial Restaurant Note (Optional)</label>
                <input
                  type="text"
                  value={newPollLocation}
                  onChange={(e) => setNewPollLocation(e.target.value)}
                  placeholder="e.g., TBD — Vote on Restaurant Suggestions Below!"
                  className="w-full min-h-[46px] px-3.5 py-2.5 rounded-xl border border-slate-200 text-base font-medium focus:border-[#005EB8] outline-none"
                />
              </div>
            </div>

            <div className="flex items-center justify-end gap-2 pt-2">
              <button
                type="button"
                onClick={() => setShowNewPollModal(false)}
                className="min-h-[44px] px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 touch-manipulation"
              >
                Cancel
              </button>
              <button
                type="submit"
                className="min-h-[44px] px-5 py-2 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-[#005EB8] to-[#00A3E0] shadow-sm touch-manipulation"
              >
                Create Live Room
              </button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

    // 4. Mount the React app into the DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
