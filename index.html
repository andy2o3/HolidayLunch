const milesBetween = (a, b) => {
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(b.latitude - a.latitude);
  const dLng = toRad(b.longitude - a.longitude);
  const h =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(a.latitude)) * Math.cos(toRad(b.latitude)) * Math.sin(dLng / 2) ** 2;
  return 3958.8 * 2 * Math.asin(Math.sqrt(h));
};

const searchRestaurantPlaces = async (input, sessionToken, restricted = true) => {
  const res = await fetch('https://places.googleapis.com/v1/places:autocomplete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': GOOGLE_PLACES_API_KEY },

      input,
      sessionToken,
      includedRegionCodes: ['us'],
      ...(restricted
        ? { locationRestriction: { circle: { center: SEARCH_CENTER, radius: SEARCH_RADIUS_METERS } } }
        : { locationBias: { circle: { center: SEARCH_CENTER, radius: 30000 } } }),
    }),
  });
  if (!res.ok) throw new Error(`Places search failed (${res.status})`);
  const data = await res.json();

    .map((s) => s.placePrediction)
    .filter((p) => p && p.placeId && isFoodPlace(p.types))

      placeId: p.placeId,
      mainText: p.structuredFormat?.mainText?.text || p.text?.text || '',

};

const EVENT_TIME_ZONE = 'America/New_York';
const EVENT_DURATION_MINUTES = 90;

// UTC offset for New York on a given date, e.g. "-05:00"
const nyOffsetFor = (dateStr) => {
  try {
    const part = new Intl.DateTimeFormat('en-US', { timeZone: EVENT_TIME_ZONE, timeZoneName: 'longOffset' })
      .formatToParts(new Date(`${dateStr}T12:00:00Z`))
      .find((p) => p.type === 'timeZoneName');
    const m = /GMT([+-]\d{2}:\d{2})/.exec(part?.value || '');
    return m ? m[1] : '-05:00';
  } catch {
    return '-05:00';
  }
};

// "12:00 PM" -> { h: 12, m: 0 }
const parseTimeLabel = (label = '12:00 PM') => {
  const m = /(\d{1,2}):(\d{2})\s*([AP]M)?/i.exec(label);
  if (!m) return { h: 12, m: 0 };
  let h = Number(m[1]) % 12;
  if ((m[3] || 'PM').toUpperCase() === 'PM') h += 12;
  return { h, m: Number(m[2]) };
};

const buildCalendarEvent = ({ dateStr, timeLabel, title, restaurant, pageLink }) => {
  const { h, m } = parseTimeLabel(timeLabel);
  const pad = (n) => String(n).padStart(2, '0');
  const start = new Date(`${dateStr}T${pad(h)}:${pad(m)}:00${nyOffsetFor(dateStr)}`);
  const end = new Date(start.getTime() + EVENT_DURATION_MINUTES * 60000);
  const location = restaurant ? [restaurant.name, restaurant.address].filter(Boolean).join(', ') : 'Restaurant TBD';
  const descriptionLines = [
    restaurant ? `Restaurant: ${restaurant.name}` : 'Restaurant: TBD',
    restaurant?.mapsUrl ? `Map: ${restaurant.mapsUrl}` : '',
    `Poll & details: ${pageLink}`,
  ].filter(Boolean);
  return { title, start, end, location, description: descriptionLines.join('\n'), pageLink };
};

const toUtcStamp = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');

const icsEscape = (s = '') => s.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');

// .ics works with Apple Calendar, Outlook desktop and most other calendar apps
const buildIcs = (ev, withReminders) => {
  const alarm = (trigger, text) => [
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    `DESCRIPTION:${icsEscape(text)}`,
    `TRIGGER:${trigger}`,
    'END:VALARM',
  ];
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Cartus and Alumni//Holiday Lunch Poll//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    `UID:holiday-lunch-${toUtcStamp(ev.start)}@andy2o3.github.io`,
    `DTSTAMP:${toUtcStamp(new Date())}`,
    `DTSTART:${toUtcStamp(ev.start)}`,
    `DTEND:${toUtcStamp(ev.end)}`,
    `SUMMARY:${icsEscape(ev.title)}`,
    `LOCATION:${icsEscape(ev.location)}`,
    `DESCRIPTION:${icsEscape(ev.description)}`,
    `URL:${ev.pageLink}`,
    ...(withReminders
      ? [...alarm('-P1D', `Tomorrow: ${ev.title}`), ...alarm('-PT1H', `In 1 hour: ${ev.title}`)]
      : []),
    'END:VEVENT',
    'END:VCALENDAR',
  ];
  return lines.join('\r\n');
};

const downloadIcs = (ics, filename) => {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) {
    // iOS Safari opens a data: calendar file straight into the "Add to Calendar" sheet
    window.location.href = `data:text/calendar;charset=utf-8,${encodeURIComponent(ics)}`;
    return;
  }
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
};

const formatDateParts = (dateStr) => {
  if (!dateStr) return { weekday: 'TBD', month: '', day: '?', full: 'Date TBD', year: '' };
  const [year, month, day] = dateStr.split('-').map(Number);
  const dateObj = new Date(year, month - 1, day);
  return {
    weekday: dateObj.toLocaleDateString('en-US', { weekday: 'short' }),
    month: dateObj.toLocaleDateString('en-US', { month: 'short' }),
    day: day,
    year: year,
    full: dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }),
  };
};

const getInitials = (name) => {
  const parts = (name || '').trim().split(/\s+/);
  if (parts.length === 0 || !parts[0]) return '?';
  if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
};

const getAvatarColor = (name) => {
  let hash = 0;
  for (let i = 0; i < (name || '').length; i++) {
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
};

const toDocKey = (name) => {
  return name.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '_');
};

// Full name = at least two words, first and last each with 2+ letters
const isValidFullName = (name) => {
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if (parts.length < 2) return false;
  const letters = (s) => (s.match(/\p{L}/gu) || []).length;
  return letters(parts[0]) >= 2 && letters(parts[parts.length - 1]) >= 2;
};

// US phone digits without the leading country code 1 (max 10 digits)
const phoneDigitsOf = (input) => input.replace(/\D/g, '').replace(/^1/, '').slice(0, 10);

const isValidUSPhone = (input) => /^[2-9]\d{9}$/.test(phoneDigitsOf(input));

// Progressive (555) 123-4567 formatting while typing
const formatUSPhone = (input) => {
  const d = phoneDigitsOf(input);
  if (d.length === 0) return '';
  if (d.length <= 3) return `(${d}`;
  if (d.length <= 6) return `(${d.slice(0, 3)}) ${d.slice(3)}`;
  return `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}`;
};

// ============================================================================
// MAIN APPLICATION COMPONENT
// ============================================================================

function App() {
  // Room / Poll Identification from URL query parameter (?room=...)
  const [roomId, setRoomId] = useState(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      return params.get('room') || 'cartus-it-2026';
    } catch {
      return 'cartus-it-2026';
    }
  });

  // Firebase Auth & Connection State
  const [user, setUser] = useState(null);
  const [syncStatus, setSyncStatus] = useState('connecting');

  // Live Clock State for Restaurant Poll Deadline
  const [nowMs, setNowMs] = useState(() => Date.now());

  // Event Metadata State (Synced in real time with Firebase Firestore)
  const [eventData, setEventData] = useState({
    title: 'Cartus and Alumni Holiday & New Year Lunch 2026–2027 🎄🥂',
    targetWindow: 'First 3 Weeks of December 2026 • Requested by Maxim',
    location: 'TBD — Vote on Restaurant Suggestions Below!',
    notes: 'Maxim requested the first 2–3 weeks of December (Dec 1 – Dec 18) for our Cartus and Alumni holiday celebration. Enter your name, tap any date(s) that work for you, and suggest/vote on a restaurant before Friday, Nov 20 at 11:59 PM!',
    dates: DEFAULT_CANDIDATE_DATES,
    restaurants: [],
    restaurantPollForceClosed: false,
    lockedDateId: null,
    sharedUrl: '',
  });

  // All Participants State (Synced in real time from Firestore subcollection)
  const [participants, setParticipants] = useState([]);

  // Current User Interaction State
  const [voterName, setVoterName] = useState(() => {
    try {
      return localStorage.getItem('cartus_it_voter_name_2026') || '';
    } catch {
      return '';
    }
  });
  const [voterPhone, setVoterPhone] = useState(() => {
    try {
      return localStorage.getItem('cartus_it_voter_phone_2026') || '';
    } catch {
      return '';
    }
  });
  const [selectedWeekFilter, setSelectedWeekFilter] = useState('all');

  // Restaurant Suggestion Inputs
  const [newRestaurantName, setNewRestaurantName] = useState('');
  const [newRestaurantNote, setNewRestaurantNote] = useState('');
  const [restaurantQuery, setRestaurantQuery] = useState('');
  const [placeSuggestions, setPlaceSuggestions] = useState([]);
  const [isSearchingPlaces, setIsSearchingPlaces] = useState(false);
  const [placesError, setPlacesError] = useState('');
  const [isAddingPlace, setIsAddingPlace] = useState(false);
  const placesSessionRef = useRef(newPlacesSessionToken());
  const [guideSearch, setGuideSearch] = useState(false); // search started from the Quick Suggestion Guide
  const [showGuide, setShowGuide] = useState(true);
  const [calendarReminders, setCalendarReminders] = useState(true);

  // Organizer (Google sign-in) state
  const [isOrganizer, setIsOrganizer] = useState(false);

  // "Can't make it" form + organizer-only view of private reasons
  const [showCantMakeItForm, setShowCantMakeItForm] = useState(false);
  const [cantMakeItReason, setCantMakeItReason] = useState('');
  const [regretReasons, setRegretReasons] = useState({});

  // Modal & UI Feedback State
  const [showShareModal, setShowShareModal] = useState(false);
  const [showAddDateModal, setShowAddDateModal] = useState(false);
  const [showNewPollModal, setShowNewPollModal] = useState(false);
  const [newDateStr, setNewDateStr] = useState('2026-12-10');
  const [newTimeLabel, setNewTimeLabel] = useState('12:00 PM');
  const [newPollTitle, setNewPollTitle] = useState('Cartus and Alumni Holiday & New Year Lunch 2026–2027 🎄');
  const [newPollLocation, setNewPollLocation] = useState('');
  const [shareUrlInput, setShareUrlInput] = useState('');
  const [copiedType, setCopiedType] = useState(null);
  const [toastMessage, setToastMessage] = useState(null);

  // Live clock tick every 30s to evaluate deadline automatically
  useEffect(() => {
    const interval = setInterval(() => setNowMs(Date.now()), 30000);
    return () => clearInterval(interval);
  }, []);

  // Persist local voter name for convenience on refresh
  useEffect(() => {
    try {
      localStorage.setItem('cartus_it_voter_name_2026', voterName);
    } catch {
      // Ignore storage restrictions
    }
  }, [voterName]);

  useEffect(() => {
    try {
      localStorage.setItem('cartus_it_voter_phone_2026', voterPhone);
    } catch {
      // Ignore storage restrictions
    }
  }, [voterPhone]);

  // 1. Authenticate Anonymously with Firebase on Mount
  useEffect(() => {
    // Sign in anonymously only when there is no saved session, so an organizer's
    // Google sign-in survives page reloads.
    const signInGuest = async () => {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.error('Firebase Auth error:', err);
        setSyncStatus('error');
      }
    };

    const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
      setUser(currentUser);
      if (!currentUser) {
        setIsOrganizer(false);
        signInGuest();
        return;
      }
      const email = (currentUser.email || '').trim().toLowerCase();
      setIsOrganizer(Boolean(email) && currentUser.emailVerified && (await sha256Hex(email)) === ORGANIZER_EMAIL_SHA256);
    });
    return () => unsubscribe();
  }, []);

  // 2. Subscribe to Real-Time Room Document & Votes Subcollection in Firestore
  useEffect(() => {
    if (!user) return;

    setSyncStatus('connecting');
    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId);
    const votesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId, 'votes');

    const unsubRoom = onSnapshot(
      roomDocRef,
      async (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          // One-time rename of text saved before the "Cartus and Alumni" rebrand
          const renamed = {};
          ['title', 'notes'].forEach((key) => {
            if (typeof data[key] === 'string' && data[key].includes('Cartus IT')) {
              renamed[key] = data[key].split('Cartus IT').join('Cartus and Alumni');
            }
          });
          if (Object.keys(renamed).length > 0) {
            Object.assign(data, renamed);
            updateDoc(roomDocRef, renamed).catch((e) => console.error('Error renaming room text:', e));
          }
          setEventData({
            title: data.title || 'Cartus and Alumni Holiday & New Year Lunch 2026–2027 🎄🥂',
            targetWindow: data.targetWindow || 'First 3 Weeks of December 2026 • Requested by Maxim',
            location: data.location || 'TBD — Vote on Restaurant Suggestions Below!',
            notes:
              data.notes ||
              'Maxim requested the first 2–3 weeks of December (Dec 1 – Dec 18) for our Cartus and Alumni holiday celebration. Enter your name, tap any date(s) that work for you, and suggest/vote on a restaurant before Friday, Nov 20 at 11:59 PM!',
            dates: Array.isArray(data.dates) && data.dates.length > 0 ? data.dates : DEFAULT_CANDIDATE_DATES,
            restaurants: Array.isArray(data.restaurants) ? data.restaurants : [],
            restaurantPollForceClosed: Boolean(data.restaurantPollForceClosed),
            lockedDateId: data.lockedDateId || null,
            sharedUrl: data.sharedUrl || '',
          });
          setSyncStatus('connected');
        } else {
          // Initialize default shared room in Firestore if it doesn't exist yet
          const initialPayload = {
            title: 'Cartus and Alumni Holiday & New Year Lunch 2026–2027 🎄🥂',
            targetWindow: 'First 3 Weeks of December 2026 • Requested by Maxim',
            location: 'TBD — Vote on Restaurant Suggestions Below!',
            notes: 'Maxim requested the first 2–3 weeks of December (Dec 1 – Dec 18) for our Cartus and Alumni holiday celebration. Enter your name, tap any date(s) that work for you, and suggest/vote on a restaurant before Friday, Nov 20 at 11:59 PM!',
            dates: DEFAULT_CANDIDATE_DATES,
            restaurants: [],
            restaurantPollForceClosed: false,
            lockedDateId: null,
            sharedUrl: '',
            createdAt: serverTimestamp(),
          };
          try {
            await setDoc(roomDocRef, initialPayload, { merge: true });
            setSyncStatus('connected');
          } catch (e) {
            console.error('Error initializing room:', e);
            setSyncStatus('error');
          }
        }
      },
      (err) => {
        console.error('Firestore room listener error:', err);
        setSyncStatus('error');
      }
    );

    const unsubVotes = onSnapshot(
      votesColRef,
      (querySnap) => {
        const loadedParticipants = [];
        querySnap.forEach((docSnap) => {
          const d = docSnap.data();
          if (d && d.name) {
            loadedParticipants.push({
              id: docSnap.id,
              name: d.name,
              votes: d.votes || {},
              restaurantVotes: Array.isArray(d.restaurantVotes) ? d.restaurantVotes : [],
              rsvpAfterRestaurantClose: Boolean(d.rsvpAfterRestaurantClose),
              cantMakeIt: Boolean(d.cantMakeIt),
              updatedAtMs: d.updatedAtMs || 0,
            });
          }
        });
        loadedParticipants.sort((a, b) => (a.updatedAtMs || 0) - (b.updatedAtMs || 0));
        setParticipants(loadedParticipants);
      },
      (err) => {
        console.error('Firestore votes listener error:', err);
      }
    );

    return () => {
      unsubRoom();
      unsubVotes();
    };
  }, [user, roomId]);

  // Organizer only: load the private "can't make it" reasons (Firestore rules block everyone else)
  useEffect(() => {
    if (!isOrganizer) {
      setRegretReasons({});
      return;
    }
    const unsub = onSnapshot(
      collection(db, 'artifacts', appId, 'private_regrets'),
      (snap) => {
        const reasons = {};
        snap.forEach((d) => {
          const r = d.data();
          if (r && r.roomId === roomId && r.reason) reasons[r.docKey] = r.reason;
        });
        setRegretReasons(reasons);
      },
      (err) => console.error('Error loading reasons:', err)
    );
    return () => unsub();
  }, [isOrganizer, roomId]);

  const triggerToast = (msg, type = 'success') => {
    setToastMessage({ text: msg, type });
    setTimeout(() => setToastMessage(null), 3400);
  };

  // ============================================================================
  // DERIVED POLL STATE (DATES & RESTAURANTS)
  // ============================================================================

  const normalizedVoterName = voterName.trim().replace(/\s+/g, ' ');
  const activeParticipant = useMemo(() => {
    if (!normalizedVoterName) return null;
    return participants.find((p) => p.name.toLowerCase() === normalizedVoterName.toLowerCase()) || null;
  }, [participants, normalizedVoterName]);

  // New participants need a first + last name and a phone number; people already
  // in the poll (returning on another device, or picked from "Already in") don't re-enter a phone.
  const nameIsValid = isValidFullName(normalizedVoterName);
  const phoneIsValid = isValidUSPhone(voterPhone);
  const identityReady = nameIsValid && (Boolean(activeParticipant) || phoneIsValid);
  const identityIssue = !normalizedVoterName
    ? 'Enter your first and last name to tap dates'
    : !nameIsValid
    ? 'Please enter your first AND last name'
    : !identityReady
    ? 'Enter your phone number with area code'
    : '';

  // Returns true when the user can participate; otherwise explains what's missing.
  const requireIdentity = () => {
    if (identityReady) return true;
    triggerToast(identityIssue + ' in Step 1.', 'error');
    const el = document.getElementById(nameIsValid ? 'voter-phone-input' : 'voter-name-input');
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.focus();
    }
    return false;
  };

  // "Can't make it": clears this person's date and restaurant picks. The optional reason is
  // stored privately (only the organizer can read it).
  const handleMarkCantMakeIt = async () => {
    if (!requireIdentity()) return;
    if (!user) return;
    const docKey = activeParticipant ? activeParticipant.id : toDocKey(normalizedVoterName);
    const name = activeParticipant ? activeParticipant.name : normalizedVoterName;
    await saveContact(docKey);
    try {
      await setDoc(
        doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId, 'votes', docKey),
        {
          name,
          votes: {},
          restaurantVotes: [],
          cantMakeIt: true,
          rsvpAfterRestaurantClose: activeParticipant ? Boolean(activeParticipant.rsvpAfterRestaurantClose) : false,
          updatedAtMs: activeParticipant?.updatedAtMs || Date.now(),
        },
        { merge: true }
      );
    } catch (err) {
      console.error("Error saving can't-make-it:", err);
      triggerToast('Could not save your response. Check connection.', 'error');
      return;
    }

    const reason = cantMakeItReason.trim().slice(0, 300);
    if (reason) {
      try {
        await setDoc(
          doc(db, 'artifacts', appId, 'private_regrets', `${roomId}__${docKey}`),
          { name, docKey, roomId, reason, uid: user.uid, updatedAtMs: Date.now() },
          { merge: true }
        );
      } catch (err) {
        console.error('Error saving reason:', err);
      }
    }

    setShowCantMakeItForm(false);
    setCantMakeItReason('');
    triggerToast("Thanks for letting us know. You're marked as can't make it.");
  };

  const handleUndoCantMakeIt = async () => {
    if (!activeParticipant || !user) return;
    try {
      await setDoc(
        doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId, 'votes', activeParticipant.id),
        { cantMakeIt: false },
        { merge: true }
      );
      triggerToast('Got it! Tap the dates that work for you below.');
    } catch (err) {
      console.error("Error undoing can't-make-it:", err);
      triggerToast('Could not update your response.', 'error');
    }
  };

  // Phone numbers go to a separate write-only collection (not readable from the page),
  // so only the organizer can see them in the Firebase console.
  const saveContact = async (docKey) => {
    if (activeParticipant || !user) return;
    const digits = phoneDigitsOf(voterPhone);
    try {
      await setDoc(
        doc(db, 'artifacts', appId, 'private_contacts', `${roomId}__${docKey}`),
        {
          name: normalizedVoterName,
          phone: '+1' + digits,
          phoneDisplay: formatUSPhone(digits),
          roomId,
          uid: user.uid,
          createdAtMs: Date.now(),
        },
        { merge: true }
      );
    } catch (err) {
      console.error('Error saving contact:', err);
    }
  };

  const isDeadlinePassed = nowMs >= RESTAURANT_DEADLINE_MS;
  const isRestaurantPollClosed = eventData.restaurantPollForceClosed || isDeadlinePassed;

  const countdownLabel = useMemo(() => {
    if (isRestaurantPollClosed) {
      return isDeadlinePassed
        ? 'Closed • Deadline Passed (Fri, Nov 20)'
        : 'Closed Early by Host • Restaurant Selection Locked';
    }
    const diff = Math.max(0, RESTAURANT_DEADLINE_MS - nowMs);
    const totalMinutes = Math.floor(diff / 60000);
    const days = Math.floor(totalMinutes / (60 * 24));
    const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
    const mins = totalMinutes % 60;
    const parts = [];
    if (days > 0) parts.push(`${days}d`);
    parts.push(`${hours}h`);
    parts.push(`${mins}m`);
    return `Closes Fri, Nov 20, 11:59 PM (${parts.join(' ')} left)`;
  }, [nowMs, isRestaurantPollClosed, isDeadlinePassed]);

  const dateStats = useMemo(() => {
    return eventData.dates.map((d) => {
      const yesPeople = [];
      participants.forEach((p) => {
        if (p.cantMakeIt) return;
        const val = p.votes?.[d.id];
        if (val === 'yes' || val === 'maybe') {
          yesPeople.push(p.name);
        }
      });
      return {
        ...d,
        yesCount: yesPeople.length,
        yesPeople,
      };
    });
  }, [eventData.dates, participants]);

  const topDates = useMemo(() => {
    return [...dateStats].sort((a, b) => b.yesCount - a.yesCount);
  }, [dateStats]);

  const maxYesCount = topDates.length > 0 ? topDates[0].yesCount : 0;

  const restaurantStats = useMemo(() => {
    return (eventData.restaurants || [])
      .map((rest) => {
        const voters = participants
          .filter((p) => !p.cantMakeIt && Array.isArray(p.restaurantVotes) && p.restaurantVotes.includes(rest.id))
          .map((p) => p.name);
        return {
          ...rest,
          voteCount: voters.length,
          voters,
        };
      })
      .sort((a, b) => b.voteCount - a.voteCount);
  }, [eventData.restaurants, participants]);

  const topRestaurantVoteCount = restaurantStats.length > 0 ? restaurantStats[0].voteCount : 0;
  const winningRestaurants = useMemo(() => {
    if (topRestaurantVoteCount === 0) return [];
    return restaurantStats.filter((r) => r.voteCount === topRestaurantVoteCount);
  }, [restaurantStats, topRestaurantVoteCount]);

  const hasWeekendsEnabled = useMemo(() => {
    return eventData.dates.some((d) => d.isWeekend);
  }, [eventData.dates]);

  const hasNewYearEnabled = useMemo(() => {
    return eventData.dates.some((d) => d.isNewYear);
  }, [eventData.dates]);

  const filteredDates = useMemo(() => {
    if (selectedWeekFilter === 'all') return dateStats;
    return dateStats.filter((d) => String(d.weekGroup) === String(selectedWeekFilter));
  }, [dateStats, selectedWeekFilter]);

  const activeUserYesCount = useMemo(() => {
    if (!activeParticipant) return 0;
    return Object.values(activeParticipant.votes || {}).filter((v) => v === 'yes' || v === 'maybe').length;
  }, [activeParticipant]);

  // ============================================================================
  // FIRESTORE REAL-TIME ACTIONS
  // ============================================================================

  const handleToggleDate = async (dateId) => {
    if (!requireIdentity()) return;
    if (!user) {
      triggerToast('Connecting to live cloud database... try again in a second.', 'info');
      return;
    }

    const docKey = activeParticipant ? activeParticipant.id : toDocKey(normalizedVoterName);
    await saveContact(docKey);
    const currentVotes = activeParticipant ? { ...activeParticipant.votes } : {};
    const isCurrentlySelected = currentVotes[dateId] === 'yes' || currentVotes[dateId] === 'maybe';

    if (isCurrentlySelected) {
      delete currentVotes[dateId];
    } else {
      currentVotes[dateId] = 'yes';
    }

    const voteDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId, 'votes', docKey);
    try {
      const isLateRsvp = !activeParticipant && isRestaurantPollClosed;
      await setDoc(
        voteDocRef,
        {
          name: activeParticipant ? activeParticipant.name : normalizedVoterName,
          votes: currentVotes,
          cantMakeIt: false,
          restaurantVotes: activeParticipant ? activeParticipant.restaurantVotes || [] : [],
          rsvpAfterRestaurantClose: activeParticipant
            ? Boolean(activeParticipant.rsvpAfterRestaurantClose)
            : isLateRsvp,
          updatedAtMs: activeParticipant?.updatedAtMs || Date.now(),
        },
        { merge: true }
      );
    } catch (err) {
      console.error('Error saving date vote:', err);
      triggerToast('Could not sync date pick. Check connection.', 'error');
    }
  };

  // Debounced Google Places search while typing in the restaurant box
  useEffect(() => {
    const q = restaurantQuery.trim();
    if (q.length < 2) {
      setPlaceSuggestions([]);
      setPlacesError('');
      setIsSearchingPlaces(false);
      return;
    }
    let cancelled = false;
    setIsSearchingPlaces(true);
    const t = setTimeout(async () => {
      try {
        const results = await searchRestaurantPlaces(q, placesSessionRef.current, !guideSearch);
        if (!cancelled) {
          setPlaceSuggestions(results);
          setPlacesError('');
        }
      } catch (err) {
        console.error('Places search error:', err);
        if (!cancelled) {
          setPlaceSuggestions([]);
          setPlacesError('Google Maps search is unavailable right now. Try again in a moment.');
        }
      } finally {
        if (!cancelled) setIsSearchingPlaces(false);
      }
    }, 300);
    return () => {
      cancelled = true;
      clearTimeout(t);
    };
  }, [restaurantQuery, guideSearch]);

  // Restaurants already on the poll that match what's being typed
  const matchingExistingRestaurants = useMemo(() => {
    const q = restaurantQuery.trim().toLowerCase();
    if (q.length < 2) return [];
    return restaurantStats.filter(
      (r) => r.name.toLowerCase().includes(q) || (r.address || '').toLowerCase().includes(q)
    );
  }, [restaurantQuery, restaurantStats]);

  const resetRestaurantSearch = () => {
    setRestaurantQuery('');
    setGuideSearch(false);
    setPlaceSuggestions([]);
    setPlacesError('');
    setNewRestaurantNote('');
    placesSessionRef.current = newPlacesSessionToken();
  };

  // Writes the current user's restaurant votes (creating their entry if needed)
  const saveRestaurantVotes = async (nextRestVotes) => {
    const docKey = activeParticipant ? activeParticipant.id : toDocKey(normalizedVoterName);
    await saveContact(docKey);
    const voteDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId, 'votes', docKey);
    await setDoc(
      voteDocRef,
      {
        name: activeParticipant ? activeParticipant.name : normalizedVoterName,
        votes: activeParticipant ? activeParticipant.votes || {} : {},
        restaurantVotes: nextRestVotes,
        cantMakeIt: false,
        rsvpAfterRestaurantClose: false,
        updatedAtMs: activeParticipant?.updatedAtMs || Date.now(),
      },
      { merge: true }
    );
  };

  // Adds a vote for a restaurant already on the poll (never removes one)
  const castVoteFor = async (rest) => {
    const current = activeParticipant ? [...(activeParticipant.restaurantVotes || [])] : [];
    if (current.includes(rest.id)) {
      triggerToast(`You already voted for ${rest.name}.`, 'info');
      return;
    }
    await saveRestaurantVotes([...current, rest.id]);
    triggerToast(`Vote added for ${rest.name}!`);
  };

  const handlePickExistingRestaurant = async (rest) => {
    if (isRestaurantPollClosed) {
      triggerToast('Restaurant voting closed on Friday, Nov 20.', 'info');
      return;
    }
    if (!requireIdentity() || !user) return;
    try {
      await castVoteFor(rest);
      resetRestaurantSearch();
    } catch (err) {
      console.error('Error voting on restaurant:', err);
      triggerToast('Could not save restaurant vote.', 'error');
    }
  };

  // Restaurant from the Quick Suggestion Guide already on the poll (matched by name)
  const findGuideMatch = (item) =>
    restaurantStats.find((r) => normalizeForMatch(r.name).includes(item.match)) || null;

  // Guide button: vote if it's already suggested, otherwise look it up on Google Maps
  const handleGuidePick = (item) => {
    if (isRestaurantPollClosed) {
      triggerToast('Restaurant voting closed on Friday, Nov 20.', 'info');
      return;
    }
    const existing = findGuideMatch(item);
    if (existing) {
      handlePickExistingRestaurant(existing);
      return;
    }
    placesSessionRef.current = newPlacesSessionToken();
    setGuideSearch(true);
    setRestaurantQuery(item.search);
    const el = document.getElementById('restaurant-search-input');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    triggerToast(`Tap the right "${item.name}" listing to add it with your vote.`, 'info');
  };

  // Picking a Google Maps result: vote for it if it's already on the poll, otherwise add it
  const handlePickPlace = async (prediction) => {
    if (isRestaurantPollClosed) {
      triggerToast('Restaurant suggestions closed on Friday, Nov 20.', 'info');
      return;
    }
    if (!requireIdentity() || !user || isAddingPlace) return;

    setIsAddingPlace(true);
    try {
      const place = await getRestaurantPlaceDetails(prediction.placeId, placesSessionRef.current);
      if (!guideSearch && place.location && milesBetween(SEARCH_CENTER, place.location) > SEARCH_RADIUS_MILES + 0.5) {
        triggerToast(`${place.name} is more than ${SEARCH_RADIUS_MILES} miles from Danbury.`, 'error');
        return;
      }

      const existing = (eventData.restaurants || []).find((r) => r.placeId && r.placeId === place.placeId);
      if (existing) {
        await castVoteFor(existing);
        resetRestaurantSearch();
        return;
      }

      const newRestObj = {
        id: 'rest-' + Date.now(),
        placeId: place.placeId,
        name: place.name,
        address: place.address,
        mapsUrl: place.mapsUrl,
        rating: place.rating,
        userRatingCount: place.userRatingCount,
        note: newRestaurantNote.trim(),
        suggestedBy: normalizedVoterName || 'Cartus and Alumni Member',
      };
      const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId);
      await updateDoc(roomDocRef, {
        restaurants: [...(eventData.restaurants || []), newRestObj],
      });

      const current = activeParticipant ? [...(activeParticipant.restaurantVotes || [])] : [];
      await saveRestaurantVotes([...current, newRestObj.id]);

      resetRestaurantSearch();
      triggerToast(`Added "${place.name}" to the restaurant poll with your vote!`);
    } catch (err) {
      console.error('Error adding restaurant:', err);
      triggerToast('Could not add that restaurant. Please try again.', 'error');
    } finally {
      setIsAddingPlace(false);
    }
  };

  const handleToggleRestaurantVote = async (restaurantId) => {
    if (isRestaurantPollClosed) {
      triggerToast('Restaurant voting is now closed! You can still RSVP for a lunch date above.', 'info');
      return;
    }
    if (!requireIdentity()) return;
    if (!user) return;

    const docKey = activeParticipant ? activeParticipant.id : toDocKey(normalizedVoterName);
    await saveContact(docKey);
    const currentRestVotes = activeParticipant ? [...(activeParticipant.restaurantVotes || [])] : [];
    const idx = currentRestVotes.indexOf(restaurantId);
    if (idx >= 0) {
      currentRestVotes.splice(idx, 1);
    } else {
      currentRestVotes.push(restaurantId);
    }

    const voteDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId, 'votes', docKey);
    try {
      await setDoc(
        voteDocRef,
        {
          name: activeParticipant ? activeParticipant.name : normalizedVoterName,
          votes: activeParticipant ? activeParticipant.votes || {} : {},
          restaurantVotes: currentRestVotes,
          cantMakeIt: false,
          rsvpAfterRestaurantClose: false,
          updatedAtMs: activeParticipant?.updatedAtMs || Date.now(),
        },
        { merge: true }
      );
    } catch (err) {
      console.error('Error voting on restaurant:', err);
      triggerToast('Could not save restaurant vote.', 'error');
    }
  };

  const handleOrganizerSignIn = async () => {
    try {
      const result = await signInWithPopup(auth, new GoogleAuthProvider());
      const email = (result.user.email || '').trim().toLowerCase();
      if ((await sha256Hex(email)) !== ORGANIZER_EMAIL_SHA256) {
        triggerToast('That Google account is not the poll organizer.', 'error');
        await signOut(auth);
      } else {
        triggerToast('Signed in as organizer.');
      }
    } catch (err) {
      if (err?.code !== 'auth/popup-closed-by-user' && err?.code !== 'auth/cancelled-popup-request') {
        console.error('Organizer sign-in error:', err);
        triggerToast('Organizer sign-in failed. Allow pop-ups and try again.', 'error');
      }
    }
  };

  const handleOrganizerSignOut = async () => {
    try {
      await signOut(auth);
      triggerToast('Signed out of organizer mode.');
    } catch (err) {
      console.error('Organizer sign-out error:', err);
    }
  };

  const handleToggleRestaurantPollClose = async () => {
    if (!user) return;
    if (!isOrganizer) {
      triggerToast('Only the poll organizer can close or reopen the restaurant poll.', 'error');
      return;
    }
    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId);
    const nextState = !eventData.restaurantPollForceClosed;
    try {
      await updateDoc(roomDocRef, { restaurantPollForceClosed: nextState });
      triggerToast(
        nextState

      );

      console.error('Error toggling restaurant poll state:', err);
      triggerToast('Could not change the poll state.', 'error');

  const handleToggleWeekends = async () => {
    if (!user) return;
    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId);
    let updatedDates;
    if (hasWeekendsEnabled) {
      updatedDates = eventData.dates.filter((d) => !d.isWeekend);
      triggerToast('Removed December weekend slots');

      const existingIds = new Set(eventData.dates.map((d) => d.id));
      const toAdd = WEEKEND_CANDIDATE_DATES.filter((d) => !existingIds.has(d.id));
      updatedDates = [...eventData.dates, ...toAdd].sort((a, b) => a.dateStr.localeCompare(b.dateStr));
      triggerToast('Added December weekend slots for everyone');
    }
    try {
      await updateDoc(roomDocRef, { dates: updatedDates });
    } catch (err) {
      console.error('Error updating weekends:', err);
    }
  };

  const handleToggleNewYearWeek = async () => {
    if (!user) return;
    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId);

      updatedDates = eventData.dates.filter((d) => !d.isNewYear);

      triggerToast('Removed New Year 2027 Kickoff week');

      const toAdd = NEW_YEAR_KICKOFF_DATES.filter((d) => !existingIds.has(d.id));

    try {
      await updateDoc(roomDocRef, { dates: updatedDates });
    } catch (err) {
      console.error('Error updating New Year dates:', err);

  const handleAddCustomDate = async (e) => {
    e.preventDefault();
    if (!newDateStr || !user) return;

    const id = `${newDateStr}-${newTimeLabel.replace(/\s+/g, '')}`;
    if (eventData.dates.some((d) => d.id === id)) {
      triggerToast('That date & time is already on the poll!', 'info');
      return;
    }

    const [, month, day] = newDateStr.split('-').map(Number);
    let weekGroup = 0;
    let tag = 'Custom Date';
    if (newDateStr.startsWith('2026-12')) {
      if (day <= 6) { weekGroup = 1; tag = 'Week 1 • Custom'; }
      else if (day <= 13) { weekGroup = 2; tag = 'Week 2 • Custom'; }
      else if (day <= 20) { weekGroup = 3; tag = 'Week 3 • Custom'; }
      else { weekGroup = 3; tag = 'Late Dec • Custom'; }
    } else if (newDateStr.startsWith('2027-01')) {
      weekGroup = 4;
      tag = 'New Year 2027 • Custom';
    }

    const updatedDates = [
      ...eventData.dates,
      { id, dateStr: newDateStr, timeLabel: newTimeLabel, tag, weekGroup },
    ].sort((a, b) => a.dateStr.localeCompare(b.dateStr));

    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId);
    try {
      await updateDoc(roomDocRef, { dates: updatedDates });
      setShowAddDateModal(false);
      triggerToast('Added new date option for the whole team!');

      console.error('Error adding date:', err);
    }

      triggerToast('Keep at least one date option in the poll.', 'error');
      return;

    const updatedDates = eventData.dates.filter((d) => d.id !== dateId);
    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId);

      await updateDoc(roomDocRef, {
        dates: updatedDates,
        lockedDateId: eventData.lockedDateId === dateId ? null : eventData.lockedDateId,

      triggerToast('Removed date option');
    } catch (err) {
      console.error('Error removing date:', err);
    }
  };

      return;
    }
    const isUnlocking = eventData.lockedDateId === dateId;
    const nextLockedId = isUnlocking ? null : dateId;
    const roomDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'cartus_rooms', roomId);

      await updateDoc(roomDocRef, { lockedDateId: nextLockedId });

      console.error('Error locking date:', err);
      triggerToast('Could not change the final date.', 'error');

      triggerToast(`Removed ${name} from the roster.`);

      console.error('Error deleting participant:', err);

    const newId = generateRoomId();

    try {
      await updateDoc(roomDocRef, { sharedUrl: cleaned });
    } catch (err) {
      console.error('Error saving shared URL:', err);

  // ============================================================================

  const copyToClipboard = async (text, typeKey) => {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
    }
    setCopiedType(typeKey);
    triggerToast('Copied to clipboard — ready to paste in chat!');
    setTimeout(() => setCopiedType(null), 2500);
  };

  const savedShareUrl = (shareUrlInput || eventData.sharedUrl || '').trim();

  const groupChatInviteText = useMemo(() => {
    const restLine =
      restaurantStats.length > 0
        ? `\n🍽️ Restaurant Poll (${isRestaurantPollClosed ? 'Closed' : 'Closes Fri, Nov 20'}): ${restaurantStats
            .slice(0, 3)
            .map((r) => `${r.name} (${r.voteCount})`)
            .join(' • ')}`
        : '\n🍽️ Restaurant Poll: Open until Fri, Nov 20 at 11:59 PM — suggest & vote on a spot!';
    const linkLine = savedShareUrl ? `\n\nTap here to enter your name & pick a date:\n${savedShareUrl}` : '';
    return `🎄 *${eventData.title}* 🥂\n🔵 *Cartus and Alumni Team • Christmas & New Year 2026–2027*\n🗓️ Primary Window: First 3 Weeks of December 2026 (Dec 1 – Dec 18) — Requested by Maxim${restLine}\n\nHey Cartus and Alumni! Just enter your name and tap the December dates that work for you (you can also see who already picked each date!):${linkLine}`;
  }, [eventData, savedShareUrl, restaurantStats, isRestaurantPollClosed]);

  const lockedDateObj = dateStats.find((d) => d.id === eventData.lockedDateId);

  // Link back to this poll (keeps a non-default room) that opens the "Add to calendar" card
  const calendarPageLink = useMemo(() => {
    const base = `${window.location.origin}${window.location.pathname}`;
    const roomQuery = roomId && roomId !== 'cartus-it-2026' ? `?room=${encodeURIComponent(roomId)}` : '';
    return `${base}${roomQuery}#add-to-calendar`;
  }, [roomId]);

  // Final restaurant: the single winner, or "A / B" when tied (no address then)
  const finalRestaurant = useMemo(() => {
    if (winningRestaurants.length === 1) return winningRestaurants[0];
    if (winningRestaurants.length > 1) return { name: winningRestaurants.map((r) => r.name).join(' / ') };
    return null;
  }, [winningRestaurants]);

  const calendarEvent = useMemo(() => {
    if (!lockedDateObj) return null;
    return buildCalendarEvent({
      dateStr: lockedDateObj.dateStr,
      timeLabel: lockedDateObj.timeLabel,
      title: 'Cartus and Alumni Holiday Lunch 🎄',
      restaurant: finalRestaurant,
      pageLink: calendarPageLink,
    });
  }, [lockedDateObj, finalRestaurant, calendarPageLink]);

  // Text message the organizer sends once the date is locked
  const finalAnnouncementText = useMemo(() => {
    if (!lockedDateObj) return '';
    const formatted = formatDateParts(lockedDateObj.dateStr);
    const restLine = finalRestaurant
      ? `🍽️ ${finalRestaurant.name}${finalRestaurant.address ? `\n📍 ${finalRestaurant.address}` : ''}`
      : '🍽️ Restaurant: TBD';
    const mapLine = finalRestaurant?.mapsUrl ? `\n🗺️ Map: ${finalRestaurant.mapsUrl}` : '';
    return `🎄 Cartus and Alumni Holiday Lunch is set! 🥂\n\n📅 ${formatted.full} at ${lockedDateObj.timeLabel}\n${restLine}${mapLine}\n\nAdd it to your calendar (Outlook, Apple, Google & more), with optional reminders the day before and 1 hour before:\n${calendarPageLink}`;
  }, [lockedDateObj, finalRestaurant, calendarPageLink]);

  const handleTextInvite = () => {
    // "sms:?&body=" opens Messages with the text filled in (works on iPhone and Android)
    window.location.href = `sms:?&body=${encodeURIComponent(finalAnnouncementText)}`;
  };

  const handleShareInvite = async () => {
    if (navigator.share) {
      try {
        await navigator.share({ title: 'Cartus and Alumni Holiday Lunch', text: finalAnnouncementText });
      } catch {
        // Share sheet dismissed
      }
    } else {
      copyToClipboard(finalAnnouncementText, 'final');
    }
  };

  // Open the "Add to calendar" card when arriving from the invite link
  useEffect(() => {
    if (window.location.hash === '#add-to-calendar' && lockedDateObj) {

        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 400);
      return () => clearTimeout(t);

  }, [Boolean(lockedDateObj)]);

  // ============================================================================
  // RENDER UI (iPhone & Mobile Safari First)
  // ============================================================================

  return (
    <div
      className="min-h-screen bg-[#F1F5F9] text-slate-800 selection:bg-[#00A3E0]/20 selection:text-[#0B1F3A] overflow-x-hidden"
      style={{ paddingBottom: 'calc(5.5rem + env(safe-area-inset-bottom, 0px))' }}
    >
      {/* Floating Toast Notification */}
      {toastMessage && (
        <div
          className="fixed left-4 right-4 sm:left-1/2 sm:right-auto sm:-translate-x-1/2 z-50 flex items-center justify-center gap-2 px-4 py-3 rounded-2xl shadow-xl bg-[#0B1F3A] text-white text-sm font-medium border border-[#00A3E0]/40"
          style={{ bottom: 'calc(4.75rem + env(safe-area-inset-bottom, 0px))' }}
        >
          <Sparkles className="w-4 h-4 text-amber-400 shrink-0" />
          <span className="truncate">{toastMessage.text}</span>

      )}

      <main className="max-w-5xl mx-auto px-3 sm:px-6 pt-4 sm:pt-6 space-y-5 sm:space-y-6">
        {/* Cartus and Alumni Hero Event Banner */}
        <section className="relative overflow-hidden rounded-2xl sm:rounded-3xl bg-gradient-to-br from-[#0B1F3A] via-[#102A4C] to-[#004A99] text-white p-4 sm:p-8 shadow-xl shadow-slate-900/15 border border-[#00A3E0]/30">
          <div className="absolute -right-12 -top-12 w-56 h-56 rounded-full bg-[#00A3E0]/15 blur-2xl pointer-events-none" />
          <div className="absolute right-8 -bottom-16 w-48 h-48 rounded-full bg-amber-400/15 blur-2xl pointer-events-none" />

          <div className="relative z-10 flex flex-col gap-4">
            <div className="flex flex-wrap items-center gap-1.5 sm:gap-2">
              <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-400/20 text-amber-200 text-[11px] sm:text-xs font-bold border border-amber-300/30">
                <Sparkles className="w-3.5 h-3.5 text-amber-300 shrink-0" />
                {eventData.targetWindow}
              </span>
              <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-white/10 text-sky-100 text-[11px] sm:text-xs font-medium border border-white/15">
                <Users className="w-3.5 h-3.5 text-[#00A3E0]" />
                {participants.length} {participants.length === 1 ? 'person' : 'people'} in
              </span>
            </div>

            <div>
              <h1 className="text-xl sm:text-3xl font-extrabold tracking-tight leading-snug text-white">
                {eventData.title}
              </h1>
              <p className="mt-1.5 text-sky-100/90 text-xs sm:text-sm max-w-3xl leading-relaxed">
                {eventData.notes}
              </p>
            </div>
          </div>
        </section>

        {/* ==================================================================== */}
        {/* LIVE POLL RESULTS: LEADING DATES & LEADING RESTAURANT                */}
        {/* ==================================================================== */}
        {(() => {
          const cantMakeItPeople = participants.filter((p) => p.cantMakeIt);
          const totalPeople = participants.length - cantMakeItPeople.length;
          const leadingDates = topDates.filter((d) => d.yesCount > 0).slice(0, 3);

          const leadingRestaurants = restaurantStats.filter((r) => r.voteCount > 0).slice(0, 3);
          const pct = (n, total) => (total > 0 ? Math.round((n / total) * 100) : 0);
          return (
            <section className="bg-white rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-sm border border-slate-200/90">
              <div className="flex items-center justify-between gap-2 mb-4">
                <div className="flex items-center gap-2">
                  <Trophy className="w-5 h-5 text-amber-500" />
                  <h2 className="text-base sm:text-lg font-extrabold text-[#0B1F3A]">Live Poll Results</h2>
                </div>
                <span className="text-xs font-semibold text-slate-500 text-right">
                  {totalPeople} attending
                  {cantMakeItPeople.length > 0 && ` · ${cantMakeItPeople.length} can't make it`}
                </span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                  <h3 className="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-[#005EB8] mb-2.5">
                    <Calendar className="w-3.5 h-3.5" /> Leading Dates
                  </h3>
                  {leadingDates.length === 0 ? (
                    <p className="text-sm text-slate-500">No date picks yet.</p>
                  ) : (
                    <ol className="space-y-3">
                      {leadingDates.map((d, i) => {
                        const isLeader = d.yesCount === maxYesCount;
                        return (
                          <li key={d.id}>
                            <div className="flex items-baseline justify-between gap-2 text-sm">
                              <span className={`font-bold ${isLeader ? 'text-[#0B1F3A]' : 'text-slate-700'}`}>
                                {isLeader ? '🏆 ' : `${i + 1}. `}
                                {formatDateParts(d.dateStr).full}
                              </span>
                              <span className="shrink-0 text-xs font-semibold text-slate-500">
                                {d.yesCount} of {totalPeople} ({pct(d.yesCount, totalPeople)}%)
                              </span>

                            </div>
                          </li>

                    </ol>
                  )}
                </div>

                <div>
                  <h3 className="flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-[#005EB8] mb-2.5">
                    <Utensils className="w-3.5 h-3.5" /> Leading Restaurant

                              />
                            </div>
                          </li>
                        );
                      })}
                    </ol>
                  )}
                </div>
              </div>

              {cantMakeItPeople.length > 0 && (

                </p>
              )}
            </section>
          );
        })()}

              setShowShareModal(true);
            }}
            className="inline-flex items-center justify-center gap-1.5 min-h-[42px] px-4 py-2 rounded-xl text-xs font-bold text-white bg-[#0B1F3A] active:scale-[0.98] transition-all shrink-0 touch-manipulation"
          >
            <Share2 className="w-3.5 h-3.5 text-[#00A3E0]" />
            <span>Share Poll</span>
          </button>
        </div>
      </div>

      {/* ====================================================================== */}
      {/* MODAL 1: SHARE WITH CARTUS AND ALUMNI GROUP CHAT (Mobile Bottom Sheet)         */}
      {/* ====================================================================== */}
      {showShareModal && (
        <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div
            className="bg-white rounded-t-3xl sm:rounded-3xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-5 sm:p-6 shadow-2xl border border-slate-100 space-y-5"
            style={{ paddingBottom: 'calc(1.25rem + env(safe-area-inset-bottom, 0px))' }}
          >
            <div className="flex items-start justify-between gap-3">
              <div>
                <h3 className="text-lg sm:text-xl font-extrabold text-[#0B1F3A]">Share with Cartus and Alumni Chat</h3>
                <p className="text-xs sm:text-sm text-slate-500 mt-1">
                  Paste your public <span className="font-semibold text-[#0B1F3A]">g.co/gemini/share/...</span> link below so everyone can open it on iPhone, Android, or PC.
                </p>
              </div>
              <button
                onClick={() => setShowShareModal(false)}
                className="w-10 h-10 flex items-center justify-center rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 shrink-0 touch-manipulation"
              >
                <X className="w-5 h-5" />
              </button>
            </div>

            <div className="space-y-2">
              <div className="flex items-center justify-between gap-2">
                <label className="text-xs font-bold uppercase tracking-wider text-slate-500">
                  Public Share Link
                </label>
                <span className="inline-flex items-center gap-1 text-[11px] font-semibold text-[#005EB8]">
                  <ExternalLink className="w-3 h-3" />
                  Use Canvas &ldquo;Share &amp; export&rdquo;
                </span>
              </div>
              <div className="flex flex-col xs:flex-row gap-2">
                <input
                  type="url"
                  inputMode="url"
                  value={shareUrlInput}
                  onChange={(e) => handleSavePublicShareUrl(e.target.value)}
                  placeholder="https://g.co/gemini/share/..."
                  className="flex-1 min-h-[46px] px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-[#005EB8] text-base text-slate-800 outline-none"
                />
                {savedShareUrl && (
                  <button
                    onClick={() => copyToClipboard(savedShareUrl, 'link')}
                    className="inline-flex items-center justify-center gap-1.5 min-h-[46px] px-4 py-2.5 rounded-xl bg-[#0B1F3A] hover:bg-[#102A4C] text-white text-sm font-semibold shrink-0 transition-all touch-manipulation"
                  >
                    {copiedType === 'link' ? <Check className="w-4 h-4 text-emerald-400" /> : <Copy className="w-4 h-4" />}
                    <span>{copiedType === 'link' ? 'Copied!' : 'Copy'}</span>
                  </button>
                )}
              </div>
            </div>

            <div className="space-y-2">
              <label className="text-xs font-bold uppercase tracking-wider text-slate-500">
                Cartus and Alumni Invite Message
              </label>
              <textarea
                readOnly
                rows={6}
                value={groupChatInviteText}
                className="w-full p-3.5 rounded-xl border border-slate-200 bg-slate-50 text-xs sm:text-sm text-slate-700 leading-relaxed resize-none focus:outline-none"
              />
              <button
                onClick={() => copyToClipboard(groupChatInviteText, 'invite')}
                className="w-full min-h-[48px] inline-flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-gradient-to-r from-[#005EB8] to-[#00A3E0] hover:brightness-110 text-white text-sm font-bold shadow-md shadow-sky-200 transition-all touch-manipulation"
              >
                {copiedType === 'invite' ? <Check className="w-4 h-4" /> : <Copy className="w-4 h-4" />}
                <span>{copiedType === 'invite' ? 'Invite Message Copied!' : 'Copy Invite Message for Chat'}</span>
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ====================================================================== */}
      {/* MODAL 2: ADD CUSTOM DATE (Mobile Bottom Sheet)                         */}
      {/* ====================================================================== */}
      {showAddDateModal && (
        <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
          <form
            onSubmit={handleAddCustomDate}
            className="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-2xl border border-slate-100 space-y-4"
            style={{ paddingBottom: 'calc(1.25rem + env(safe-area-inset-bottom, 0px))' }}
          >
            <div className="flex items-center justify-between">
              <h3 className="text-lg font-extrabold text-[#0B1F3A]">Add Custom Date Option</h3>
              <button
                type="button"
                onClick={() => setShowAddDateModal(false)}
                className="w-10 h-10 flex items-center justify-center rounded-xl text-slate-400 hover:text-slate-700 touch-manipulation"
              >
                <X className="w-5 h-5" />
              </button>
            </div>

            <div className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">Select Date</label>
                <input
                  type="date"
                  required
                  value={newDateStr}
                  onChange={(e) => setNewDateStr(e.target.value)}
                  className="w-full min-h-[46px] px-3.5 py-2.5 rounded-xl border border-slate-200 text-base font-medium focus:border-[#005EB8] outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">Lunch Time</label>
                <select
                  value={newTimeLabel}
                  onChange={(e) => setNewTimeLabel(e.target.value)}
                  className="w-full min-h-[46px] px-3.5 py-2.5 rounded-xl border border-slate-200 text-base font-medium focus:border-[#005EB8] outline-none bg-white"
                >
                  <option value="11:30 AM">11:30 AM</option>
                  <option value="12:00 PM">12:00 PM</option>
                  <option value="12:30 PM">12:30 PM</option>
                  <option value="1:00 PM">1:00 PM</option>
                  <option value="1:30 PM">1:30 PM</option>
                </select>
              </div>
            </div>

            <div className="flex items-center justify-end gap-2 pt-2">
              <button
                type="button"
                onClick={() => setShowAddDateModal(false)}
                className="min-h-[44px] px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 touch-manipulation"
              >
                Cancel
              </button>
              <button
                type="submit"
                className="min-h-[44px] px-5 py-2 rounded-xl text-sm font-bold text-white bg-[#005EB8] hover:bg-[#004A99] shadow-sm touch-manipulation"
              >
                Add to Poll
              </button>
            </div>
          </form>
        </div>
      )}

      {/* ====================================================================== */}
      {/* MODAL 3: START A NEW LIVE POLL ROOM (Mobile Bottom Sheet)              */}
      {/* ====================================================================== */}
      {showNewPollModal && (
        <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
          <form
            onSubmit={handleCreateNewRoom}
            className="bg-white rounded-t-3xl sm:rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-2xl border border-slate-100 space-y-4"
            style={{ paddingBottom: 'calc(1.25rem + env(safe-area-inset-bottom, 0px))' }}
          >
            <div className="flex items-center justify-between">
              <h3 className="text-lg font-extrabold text-[#0B1F3A]">Create Separate Live Poll Room</h3>
              <button
                type="button"
                onClick={() => setShowNewPollModal(false)}
                className="w-10 h-10 flex items-center justify-center rounded-xl text-slate-400 hover:text-slate-700 touch-manipulation"
              >
                <X className="w-5 h-5" />
              </button>
            </div>

            <p className="text-xs text-slate-500">
              Spins up a fresh, isolated live cloud room for another sub-team while keeping your current Cartus and Alumni poll intact.
            </p>

            <div className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">Event Name</label>
                <input
                  type="text"
                  required
                  value={newPollTitle}
                  onChange={(e) => setNewPollTitle(e.target.value)}
                  className="w-full min-h-[46px] px-3.5 py-2.5 rounded-xl border border-slate-200 text-base font-medium focus:border-[#005EB8] outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">Initial Restaurant Note (Optional)</label>
                <input
                  type="text"
                  value={newPollLocation}
                  onChange={(e) => setNewPollLocation(e.target.value)}
                  placeholder="e.g., TBD — Vote on Restaurant Suggestions Below!"
                  className="w-full min-h-[46px] px-3.5 py-2.5 rounded-xl border border-slate-200 text-base font-medium focus:border-[#005EB8] outline-none"
                />
              </div>
            </div>

            <div className="flex items-center justify-end gap-2 pt-2">
              <button
                type="button"
                onClick={() => setShowNewPollModal(false)}
                className="min-h-[44px] px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 touch-manipulation"
              >
                Cancel
              </button>
              <button
                type="submit"
                className="min-h-[44px] px-5 py-2 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-[#005EB8] to-[#00A3E0] shadow-sm touch-manipulation"
              >
                Create Live Room
              </button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

    // 4. Mount the React app into the DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
